<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Promedio </title>
</head>
<body>
    <script>
        const nombre = prompt("Ingrese el nombre del estudiante:");
        const apellido = prompt("Ingrese el apellido del estudiante:");

    
        const nota1 = parseFloat(prompt("Ingrese la primera calificación (30%):"));
        const nota2 = parseFloat(prompt("Ingrese la segunda calificación (35%):"));
        const nota3 = parseFloat(prompt("Ingrese la tercera calificación (35%):"));

     
        const promedio = (nota1 * 0.30) + (nota2 * 0.35) + (nota3 * 0.35);

        
        document.write(`El promedio de notas ponderado de ${nombre} ${apellido} es ${promedio.toFixed(1)}`);
    </script>
</body>
</html>
